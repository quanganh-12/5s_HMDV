<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>5S</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="container text-center">

<h2 class="mt-3">5S</h2>

<!-- ✅ BANK ĐÁP ÁN -->
<div id="answerBank" class="d-flex justify-content-center gap-3 mt-3">

    <div class="answer source" draggable="true" data-type="sorted">
        Chưa Sàng lọc
    </div>

    <div class="answer source" draggable="true" data-type="organized">
        Chưa sắp xếp
    </div>

    <div class="answer source" draggable="true" data-type="clean">
        Chưa sạch sẽ
    </div>

    <div class="answer source" draggable="true" data-type="5s">
        5S tốt
    </div>

</div>


<!-- ✅ KHU VỰC ITEM -->
<div id="items" class="d-flex flex-wrap justify-content-center mt-3"></div>

<!-- ✅ NÚT CHECK -->
<button id="checkBtn" class="btn btn-primary mt-3" disabled>
✅ Kiểm tra
</button>

<hr>

<!-- ✅ DANH SÁCH ẢNH (DROP ZONE) -->
<div class="d-flex flex-wrap justify-content-center">

    <div class="image-box" data-name="1.jpg"><img src="images/1.jpg"></div>
    <div class="image-box" data-name="2.jpg"><img src="images/2.jpg"></div>
    <div class="image-box" data-name="3.jpg"><img src="images/3.jpg"></div>
    <div class="image-box" data-name="4.jpg"><img src="images/4.jpg"></div>
    <div class="image-box" data-name="5.jpg"><img src="images/5.jpg"></div>
    <div class="image-box" data-name="6.jpg"><img src="images/6.jpg"></div>
    <div class="image-box" data-name="7.jpg"><img src="images/7.jpg"></div>
    <div class="image-box" data-name="8.jpg"><img src="images/8.jpg"></div>
    <div class="image-box" data-name="9.jpg"><img src="images/9.jpg"></div>
    <div class="image-box" data-name="10.jpg"><img src="images/10.jpg"></div>
</div>

<!-- ✅ MODAL -->
<div class="modal fade" id="resultModal">
  <div class="modal-dialog">
    <div class="modal-content text-center p-3">
      <h3 id="resultText"></h3>
      <button class="btn btn-secondary mt-3" data-bs-dismiss="modal">Đóng</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
